name: Temporary Verify AetherCast Browser

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify static files and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object aethercast-demo/index.html)" = '4eea8ad3b7d2f5fa91f61a8cfae8468ca1165f88'
          test "$(git hash-object aethercast-demo/app.js)" = '552a1d17037c0fe25c04db8fc12dce20c4856793'
          ! grep -q 'atob(' aethercast-demo/index.html
          ! grep -q 'DecompressionStream' aethercast-demo/index.html
          grep -q '<script src="./app.js"></script>' aethercast-demo/index.html
          node --check aethercast-demo/app.js
          test "$(head -c 4 aethercast-demo/air_temperature_2m.wxt)" = 'WXT1'
          test "$(head -c 4 aethercast-demo/wind_10m_uv.wxt)" = 'WXT1'

      - name: Verify public immutable URLs
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githack.com/hujinghaoabcd/PyWESM/891cd6d1632d3ee5a5458f3a26a20294b7a41f28/aethercast-demo'
          curl --fail --location --retry 5 "$BASE/index.html" -o /tmp/public-index.html
          curl --fail --location --retry 5 "$BASE/app.js" -o /tmp/public-app.js
          grep -q '<script src="./app.js"></script>' /tmp/public-index.html
          ! grep -q 'atob(' /tmp/public-index.html
          node --check /tmp/public-app.js
          curl --fail --location --retry 3 'https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js' -o /tmp/maplibre.js
          curl --fail --location --retry 3 'https://tiles.openfreemap.org/styles/liberty' -o /tmp/style.json
          grep -q 'sources' /tmp/style.json

      - name: Open the page in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory aethercast-demo >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --virtual-time-budget=30000 \
            --window-size=412,915 \
            --dump-dom http://127.0.0.1:8000/index.html > /tmp/dom.html 2>/tmp/chrome.log
          grep -q '全中国 WXT 已加载' /tmp/dom.html || { cat /tmp/chrome.log; tail -n 80 /tmp/dom.html; exit 1; }
          grep -q 'loading-cover hide' /tmp/dom.html
          echo 'Headless Chrome loaded MapLibre, OpenFreeMap and both WXT files successfully.'

      - name: Capture mobile screenshot
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --ignore-gpu-blocklist \
            --virtual-time-budget=30000 --window-size=412,915 \
            --screenshot=aethercast-mobile.png http://127.0.0.1:8000/index.html
          test -s aethercast-mobile.png

      - uses: actions/upload-artifact@v4
        with:
          name: aethercast-mobile-browser-proof
          path: aethercast-mobile.png
          retention-days: 1
