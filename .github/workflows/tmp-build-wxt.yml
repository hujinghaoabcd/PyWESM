name: Temporary WXT MVP Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and unpack source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat source_bundle.part00 source_bundle.part01 source_bundle.part02 source_bundle.part03 source_bundle.part04 > source_bundle.zip.b64
          base64 --decode source_bundle.zip.b64 > source_bundle.zip
          unzip -q source_bundle.zip

      - name: Apply header CRC fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('aethercast-wxt-mvp/rust/wxt-builder/src/main.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    // Header CRC is calculated with bytes 108..112 set to zero.\n    let header_crc = crc32(&header);\n    put_u32(&mut header, 108, header_crc);\n    let label = spec.variable_label.as_bytes();\n    let copy_len = label.len().min(16);\n    header[112..112 + copy_len].copy_from_slice(&label[..copy_len]);\n'''
          new = '''    // Copy every header field before calculating the CRC. The CRC field\n    // itself (bytes 108..112) is still zero at this point.\n    let label = spec.variable_label.as_bytes();\n    let copy_len = label.len().min(16);\n    header[112..112 + copy_len].copy_from_slice(&label[..copy_len]);\n    let header_crc = crc32(&header);\n    put_u32(&mut header, 108, header_crc);\n'''
          if old not in text:
              raise SystemExit('CRC patch target not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Normalize GFS with Python
        working-directory: aethercast-wxt-mvp
        run: |
          python python/normalize_gfs.py sample/gfs_nanjing.grib2 build/standardized --engine fallback

      - name: Build and run Rust WXT generator
        working-directory: aethercast-wxt-mvp
        run: |
          cargo run --release --manifest-path rust/wxt-builder/Cargo.toml -- \
            --input build/standardized/manifest.json \
            --output build/wxt \
            --size 256

      - name: Verify WXT files
        working-directory: aethercast-wxt-mvp
        run: |
          python python/verify_wxt.py \
            build/wxt/air_temperature_2m.wxt \
            build/wxt/wind_10m_uv.wxt \
            --json build/wxt/verification.json
          sha256sum build/wxt/*.wxt > build/wxt/SHA256SUMS.txt
          cp rust/wxt-builder/target/release/wxt-builder build/wxt/wxt-builder-linux-x86_64

      - name: Upload verified outputs
        uses: actions/upload-artifact@v4
        with:
          name: aethercast-wxt-mvp-output
          path: |
            aethercast-wxt-mvp/build/standardized/
            aethercast-wxt-mvp/build/wxt/
          if-no-files-found: error
          retention-days: 1
