name: Temporary Export AetherCast Index

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply MapLibre style-readiness patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('aethercast-demo/app.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "    map.once('load', fitChina);",
              "    if (map.isStyleLoaded()) fitChina(); else map.once('style.load', fitChina);",
          )

          old = "    Promise.all([loadWxt(DATA.temp),loadWxt(DATA.wind),new Promise((resolve,reject)=>{if(map.loaded())resolve();else{map.once('load',resolve);map.once('error',reject);}})])\n"
          new = """    function waitForMapStyle() {
      if (map.isStyleLoaded()) return Promise.resolve();
      return new Promise((resolve, reject) => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve();
        };
        const timer = setTimeout(() => {
          if (map.getStyle() && Array.isArray(map.getStyle().layers)) finish();
          else reject(new Error('MapLibre 底图样式加载超时'));
        }, 20000);
        map.once('style.load', finish);
        map.once('load', finish);
      });
    }

    Promise.all([loadWxt(DATA.temp), loadWxt(DATA.wind), waitForMapStyle()])
"""
          if old in text:
              text = text.replace(old, new)
          elif 'function waitForMapStyle()' not in text:
              raise SystemExit('Old readiness block was not found')

          if "map.once('error',reject)" in text:
              raise SystemExit('Old map readiness logic remains')
          path.write_text(text, encoding='utf-8')

      - name: Validate and push main
        shell: bash
        run: |
          set -euo pipefail
          node --check aethercast-demo/app.js
          grep -q 'function waitForMapStyle' aethercast-demo/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aethercast-demo/app.js
          if git diff --cached --quiet; then
            echo 'MapLibre style-readiness patch already present'
          else
            git commit -m 'fix: initialize weather after MapLibre style loads'
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: current-aethercast-index
          path: |
            aethercast-demo/index.html
            aethercast-demo/app.js
          if-no-files-found: error
          retention-days: 1
