name: Temporary Fix AetherCast Mobile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace compressed loader with plain HTML
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip
          import re

          path = Path('aethercast-demo/index.html')
          loader = path.read_text(encoding='utf-8')
          match = re.search(r"const b64='([^']+)'", loader)
          if not match:
              raise SystemExit('Base64 loader was not found')

          html = gzip.decompress(base64.b64decode(match.group(1), validate=True)).decode('utf-8')
          if '<!doctype html>' not in html.lower():
              raise SystemExit('Decoded document is not HTML')
          if 'maplibregl.Map' not in html:
              raise SystemExit('Decoded document does not contain MapLibre app')
          if 'atob(' in html or 'DecompressionStream' in html:
              raise SystemExit('Decoded document unexpectedly contains loader code')

          path.write_text(html, encoding='utf-8')
          print(f'Wrote plain HTML: {path.stat().st_size} bytes')

      - name: Commit fixed mobile page to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aethercast-demo/index.html
          git commit -m 'fix: serve AetherCast as plain HTML on mobile'
          git push origin HEAD:main
