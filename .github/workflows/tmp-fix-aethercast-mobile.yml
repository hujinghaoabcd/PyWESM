name: Temporary Fix AetherCast Mobile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: hujinghaoabcd/PyWESM
      INDEX_BLOB: 4eea8ad3b7d2f5fa91f61a8cfae8468ca1165f88
      APP_BLOB: 552a1d17037c0fe25c04db8fc12dce20c4856793
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore verified plain HTML and JavaScript blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aethercast-demo
          gh api "repos/$REPO/git/blobs/$INDEX_BLOB" --jq .content | tr -d '\n' | base64 --decode > aethercast-demo/index.html
          gh api "repos/$REPO/git/blobs/$APP_BLOB" --jq .content | tr -d '\n' | base64 --decode > aethercast-demo/app.js

          test "$(git hash-object aethercast-demo/index.html)" = "$INDEX_BLOB"
          test "$(git hash-object aethercast-demo/app.js)" = "$APP_BLOB"
          grep -q '<script src="./app.js"></script>' aethercast-demo/index.html
          grep -q 'maplibregl.Map' aethercast-demo/app.js
          ! grep -q 'atob(' aethercast-demo/index.html
          ! grep -q 'DecompressionStream' aethercast-demo/index.html

      - name: Commit mobile-safe page to main when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aethercast-demo/index.html aethercast-demo/app.js
          if git diff --cached --quiet; then
            echo 'main already contains the verified mobile-safe files'
            exit 0
          fi
          git commit -m 'fix: serve AetherCast without Base64 loader'
          git push origin HEAD:main
