name: Temporary Deploy China WXT

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GRIB dependencies
        run: python -m pip install --quiet numpy xarray cfgrib eccodes

      - name: Download China GFS subset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/input build/standardized build/wxt
          URL='https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl?file=gfs.t12z.pgrb2.0p25.f000&lev_2_m_above_ground=on&lev_10_m_above_ground=on&var_TMP=on&var_UGRD=on&var_VGRD=on&subregion=&leftlon=72&rightlon=136&toplat=54&bottomlat=17&dir=%2Fgfs.20260731%2F12%2Fatmos'
          curl --fail --location --retry 5 --retry-delay 5 --max-time 600 "$URL" -o build/input/china.grib2
          test "$(head -c 4 build/input/china.grib2)" = 'GRIB'

      - name: Standardize GRIB with Python
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import numpy as np
          import xarray as xr

          src = Path('build/input/china.grib2')
          out = Path('build/standardized')
          out.mkdir(parents=True, exist_ok=True)
          specs = [
              (167, 'air_temperature_2m', 't2m', 'K', 'TMP', 2.0),
              (165, 'eastward_wind_10m', 'u10', 'm s-1', 'UGRD', 10.0),
              (166, 'northward_wind_10m', 'v10', 'm s-1', 'VGRD', 10.0),
          ]
          variables = []
          grid = None
          for param_id, var_id, expected_name, unit, source_name, level in specs:
              ds = xr.open_dataset(src, engine='cfgrib', backend_kwargs={'filter_by_keys': {'paramId': param_id}, 'indexpath': ''})
              name = expected_name if expected_name in ds.data_vars else next(iter(ds.data_vars))
              da = ds[name].squeeze(drop=True)
              lat_name = 'latitude' if 'latitude' in da.coords else 'lat'
              lon_name = 'longitude' if 'longitude' in da.coords else 'lon'
              da = da.sortby(lat_name).sortby(lon_name)
              values = np.asarray(da.values, dtype='<f4')
              path = out / f'{var_id}.f32le'
              values.tofile(path)
              lats = np.asarray(da[lat_name].values)
              lons = np.asarray(da[lon_name].values)
              if grid is None:
                  grid = {
                      'type': 'regular_latlon', 'width': int(values.shape[1]), 'height': int(values.shape[0]),
                      'west': float(lons.min()), 'south': float(lats.min()), 'east': float(lons.max()), 'north': float(lats.max()),
                      'dx': float(abs(lons[1]-lons[0])), 'dy': float(abs(lats[1]-lats[0])),
                      'layout': 'row-major', 'row_direction': 'south-to-north', 'column_direction': 'west-to-east'
                  }
              variables.append({
                  'id': var_id, 'source_name': source_name, 'unit': unit, 'level_type_code': 103, 'level_value': level,
                  'dtype': 'float32-le', 'file': path.name, 'min': float(np.nanmin(values)), 'max': float(np.nanmax(values)), 'count': int(values.size)
              })
          manifest = {
              'schema': 'aether-standard-grid', 'schema_version': 1, 'decoder': 'cfgrib-eccodes',
              'source': {'file': src.name, 'sha256': hashlib.sha256(src.read_bytes()).hexdigest(), 'format': 'GRIB2', 'provider': 'NOAA/NCEP NOMADS', 'model': 'GFS 0.25 degree'},
              'run_time': '2026-07-31T12:00:00Z', 'valid_time': '2026-07-31T12:00:00Z', 'forecast_hour': 0,
              'grid': grid, 'variables': variables
          }
          (out/'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps(manifest['grid'], indent=2))
          PY

      - name: Retrieve verified Rust WXT builder
        run: |
          gh run download 30658506775 -R hujinghaoabcd/PyWESM -n aethercast-wxt-mvp-output -D build/builder
          chmod +x build/builder/wxt/wxt-builder-linux-x86_64

      - name: Generate China WXT with Rust
        run: |
          build/builder/wxt/wxt-builder-linux-x86_64 --input build/standardized/manifest.json --output build/wxt --size 512
          test "$(head -c 4 build/wxt/air_temperature_2m.wxt)" = 'WXT1'
          test "$(head -c 4 build/wxt/wind_10m_uv.wxt)" = 'WXT1'
          sha256sum build/wxt/*.wxt

      - name: Commit binary WXT files to main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aethercast-deploy
          cp build/wxt/air_temperature_2m.wxt /tmp/aethercast-deploy/
          cp build/wxt/wind_10m_uv.wxt /tmp/aethercast-deploy/
          git fetch origin main
          git switch main
          mkdir -p aethercast-demo
          cp /tmp/aethercast-deploy/*.wxt aethercast-demo/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aethercast-demo/*.wxt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add full-China GFS WXT data'
          git push origin main
