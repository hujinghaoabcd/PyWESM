<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <title>AetherCast 中国 GFS · MapLibre</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(7, 20, 34, .88);
      --panel-soft: rgba(9, 26, 43, .74);
      --border: rgba(170, 205, 230, .2);
      --text: #eef7ff;
      --muted: #9db3c7;
      --accent: #62d8ff;
      --good: #68e5a8;
    }
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #07131f; color: var(--text); }
    #map { position: absolute; inset: 0; }
    #fieldCanvas { position: fixed; left: -10000px; top: -10000px; width: 512px; height: 512px; }
    #windCanvas { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }
    .maplibregl-canvas { outline: none; }
    .maplibregl-ctrl-group { background: rgba(8, 23, 38, .9); border: 1px solid var(--border); box-shadow: none; }
    .maplibregl-ctrl-group button { filter: invert(1); }
    .maplibregl-ctrl-attrib { background: rgba(5, 15, 26, .72) !important; color: #bdd0df; }
    .maplibregl-ctrl-attrib a { color: #dff5ff; }

    .topbar {
      position: absolute; z-index: 6; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
      pointer-events: none;
    }
    .brand, .status, .panel, .readout, .legend { pointer-events: auto; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .brand { padding: 13px 15px; border: 1px solid var(--border); border-radius: 15px; background: var(--panel); box-shadow: 0 16px 45px rgba(0,0,0,.24); }
    .brand .eyebrow { font-size: 10px; letter-spacing: .17em; color: var(--accent); font-weight: 700; }
    .brand h1 { margin: 5px 0 3px; font-size: 20px; line-height: 1.1; font-weight: 650; }
    .brand p { margin: 0; color: var(--muted); font-size: 12px; }
    .status { display: flex; gap: 9px; align-items: center; padding: 9px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); font-size: 12px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffd166; box-shadow: 0 0 0 5px rgba(255,209,102,.1); animation: pulse 1s alternate infinite; }
    .dot.ready { background: var(--good); box-shadow: 0 0 0 5px rgba(104,229,168,.1); animation: none; }
    .dot.error { background: #ff6b7a; animation: none; }
    @keyframes pulse { to { opacity: .35; } }

    .panel {
      position: absolute; z-index: 6; top: 98px; left: 14px; width: 244px;
      padding: 14px; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); box-shadow: 0 18px 50px rgba(0,0,0,.25);
    }
    .control { margin-bottom: 14px; }
    .control:last-child { margin-bottom: 0; }
    .control label, .switch-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 7px; color: #d7e8f3; font-size: 12px; }
    select, button { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; background: #0b2034; color: var(--text); font: inherit; }
    button { cursor: pointer; }
    button:hover { border-color: rgba(98,216,255,.55); }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    input[type="checkbox"] { width: 38px; height: 20px; accent-color: var(--accent); }
    output { color: var(--accent); font-variant-numeric: tabular-nums; }
    .meta { border-top: 1px solid var(--border); margin-top: 13px; padding-top: 11px; display: grid; gap: 7px; }
    .meta div { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; }
    .meta span { color: var(--muted); }
    .meta strong { text-align: right; font-weight: 550; font-variant-numeric: tabular-nums; }

    .readout { position: absolute; z-index: 6; right: 14px; top: 72px; width: 205px; padding: 12px 13px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); box-shadow: 0 15px 45px rgba(0,0,0,.22); }
    .readout h2 { margin: 0 0 8px; color: var(--accent); font-size: 11px; letter-spacing: .12em; }
    .readout div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 12px; }
    .readout span { color: var(--muted); }
    .readout strong { font-weight: 600; font-variant-numeric: tabular-nums; }

    .legend { position: absolute; z-index: 6; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(510px, calc(100% - 32px)); padding: 10px 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); }
    .legend-head, .legend-labels { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
    .legend-head { margin-bottom: 7px; }
    .legend-head span:last-child, .legend-labels { color: var(--muted); }
    .gradient { height: 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: linear-gradient(90deg,#422f9c,#285fc4,#27a8d0,#36c79d,#d9db4d,#f5943f,#d93c45); }
    .gradient.wind { background: linear-gradient(90deg,#173c65,#226d9d,#2ab0bd,#55d5a4,#d6dd55,#f79a45,#d63a4d); }
    .legend-labels { margin-top: 5px; font-variant-numeric: tabular-nums; }

    .loading-cover { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: #07131f; transition: opacity .35s; }
    .loading-cover.hide { opacity: 0; pointer-events: none; }
    .loader { text-align: center; }
    .loader b { display: block; margin-bottom: 8px; font-size: 18px; }
    .loader span { color: var(--muted); font-size: 13px; }

    @media (max-width: 720px) {
      .topbar { left: 9px; right: 9px; top: 9px; }
      .brand { padding: 10px 12px; }
      .brand h1 { font-size: 16px; }
      .brand p { display: none; }
      .status { padding: 8px 10px; }
      .panel { left: 9px; top: auto; bottom: 88px; width: 205px; padding: 11px; }
      .panel .meta { display: none; }
      .readout { right: 9px; top: 62px; width: 178px; }
      .legend { bottom: 14px; }
      .maplibregl-ctrl-bottom-right { bottom: 78px; }
    }
    @media (max-width: 480px) {
      .status span:last-child { display: none; }
      .panel { width: 180px; }
      .readout { width: 160px; }
      .control { margin-bottom: 10px; }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="中国 GFS 气象地图"></div>
  <canvas id="fieldCanvas" width="512" height="512"></canvas>
  <canvas id="windCanvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">AETHERCAST · MAPLIBRE</div>
      <h1>中国 GFS 温度与风场</h1>
      <p>Python 标准化 → Rust WXT → MapLibre 可视化</p>
    </div>
    <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">加载 WXT 数据</span></div>
  </header>

  <aside class="panel" aria-label="地图控制">
    <div class="control">
      <label for="layerMode"><span>气象图层</span></label>
      <select id="layerMode">
        <option value="temperature">2 m 气温 + 风粒子</option>
        <option value="wind">10 m 风速 + 风粒子</option>
        <option value="temperatureOnly">仅 2 m 气温</option>
        <option value="basemap">仅外部底图</option>
      </select>
    </div>
    <div class="control">
      <label for="opacityRange"><span>覆盖层透明度</span><output id="opacityOutput">68%</output></label>
      <input id="opacityRange" type="range" min="0" max="100" step="1" value="68">
    </div>
    <div class="control">
      <label for="densityRange"><span>风粒子数量</span><output id="densityOutput">1800</output></label>
      <input id="densityRange" type="range" min="400" max="3500" step="100" value="1800">
    </div>
    <div class="control">
      <label for="speedRange"><span>粒子速度</span><output id="speedOutput">1.0×</output></label>
      <input id="speedRange" type="range" min="0.3" max="2.5" step="0.1" value="1.0">
    </div>
    <div class="control"><button id="resetView" type="button">返回全中国视图</button></div>
    <div class="meta">
      <div><span>数据</span><strong>GFS 0.25°</strong></div>
      <div><span>源网格</span><strong>257 × 149</strong></div>
      <div><span>WXT</span><strong>512 × 512</strong></div>
      <div><span>范围</span><strong>72–136°E<br>17–54°N</strong></div>
      <div><span>时间</span><strong>2026-07-31<br>12:00 UTC</strong></div>
    </div>
  </aside>

  <section class="readout" aria-live="polite">
    <h2>指针位置</h2>
    <div><span>经纬度</span><strong id="rLocation">—</strong></div>
    <div><span>气温</span><strong id="rTemp">—</strong></div>
    <div><span>风速</span><strong id="rWind">—</strong></div>
    <div><span>风向</span><strong id="rDirection">—</strong></div>
  </section>

  <section class="legend">
    <div class="legend-head"><strong id="legendTitle">2 m 气温</strong><span id="legendUnit">°C</span></div>
    <div id="legendGradient" class="gradient"></div>
    <div class="legend-labels"><span id="legendMin">−20</span><span id="legendMid">12</span><span id="legendMax">45</span></div>
  </section>

  <div id="loadingCover" class="loading-cover"><div class="loader"><b>AetherCast 中国气象场</b><span id="loadingText">正在下载并解析 WXT 数值瓦片…</span></div></div>

  <script src="./app.js"></script>
</body>
</html>
